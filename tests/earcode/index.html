<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>귀 프로필 코드 테스트</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f2f0eb">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #f2f0eb;
      color: #111111;
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button, input {
      font: inherit;
      color: inherit;
      background: none;
      border: 1px solid #111111;
      border-radius: 0;
    }

    button {
      cursor: pointer;
    }

    .mono {
      font-family: "IBM Plex Mono", monospace;
    }

    #app {
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 820px;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    #code {
      font-size: 88px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.06em;
    }

    #codeWords {
      font-size: 14px;
      opacity: 0.7;
      min-height: 20px;
    }

    #curve {
      width: 100%;
      height: 160px;
      border: 1px solid #111111;
      background-color: #ffffff;
    }

    .slot {
      display: grid;
      grid-template-columns: 64px 1fr;
      align-items: center;
      gap: 8px;
    }

    .slot .name {
      font-size: 13px;
    }

    .letters {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 6px;
    }

    .letters button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 10px 0 8px;
      font-size: 26px;
      font-weight: 500;
      transition: background-color 0.15s, color 0.15s;
    }

    .letters button .sub {
      font-family: "Noto Sans KR", sans-serif;
      font-size: 10px;
      font-weight: 400;
      opacity: 0.6;
    }

    .letters button.on {
      background-color: #111111;
      color: #f2f0eb;
    }

    .letters button.touring {
      outline: 4px solid #e8452c;
      outline-offset: -4px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .row button, .row input {
      padding: 14px 12px;
      font-size: 15px;
    }

    .row input {
      flex: 1;
      min-width: 120px;
      font-family: "IBM Plex Mono", monospace;
      user-select: text;
      -webkit-user-select: text;
    }

    button.primary {
      background-color: #111111;
      color: #f2f0eb;
    }

    button.active {
      background-color: #e8452c;
      border-color: #e8452c;
      color: #ffffff;
    }

    #status {
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.7;
      white-space: pre-line;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background-color: #f2f0eb;
      font-size: 20px;
      text-align: center;
      padding: 16px;
      z-index: 10;
    }

    #startOverlay .hint {
      font-size: 13px;
      opacity: 0.6;
      line-height: 1.6;
    }
  </style>

  <script src="../../earCode.js"></script>
  <script src="./earcode-test.js" defer></script>
</head>
<body>
  <div id="startOverlay">
    <div>헤드폰을 쓰고 화면을 터치하세요</div>
    <div class="hint">귀 프로필 코드 테스트 (Part 1 음색 + 음량)<br>글자를 누르면 그 코드의 EQ가 바로 입혀집니다</div>
  </div>

  <div id="app">
    <header>
      <span class="mono">EAR CODE · PART 1</span>
      <span id="roundtrip" class="mono"></span>
    </header>

    <div>
      <div id="code" class="mono">AEE/5</div>
      <div id="codeWords"></div>
    </div>

    <canvas id="curve"></canvas>

    <div id="slots"></div>

    <div class="row">
      <button id="tourBtn" class="primary">모든 글자 하나씩 듣기</button>
      <button id="bypassBtn">원래 소리</button>
      <button id="randomBtn">다른 사람 귀 (무작위)</button>
    </div>

    <div class="row">
      <input id="codeInput" placeholder="코드 입력 예) IwS/6" maxlength="8" autocapitalize="off" autocomplete="off" spellcheck="false">
      <button id="loadBtn">불러오기</button>
    </div>

    <div class="row" id="sourceRow"></div>

    <div id="status" class="mono"></div>
  </div>
</body>
</html>
