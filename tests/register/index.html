<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>음역 고르기 테스트</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f2f0eb">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background-color: #f2f0eb;
      color: #111111;
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 1px solid #111111;
      border-radius: 0;
      cursor: pointer;
    }

    .mono {
      font-family: "IBM Plex Mono", monospace;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    #prompt {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.45;
      min-height: 64px;
    }

    #cards {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      min-height: 0;
    }

    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      font-size: 56px;
      font-weight: 500;
      text-align: left;
      transition: background-color 0.15s, color 0.15s;
    }

    .card .sub {
      font-size: 12px;
      font-weight: 400;
      opacity: 0.6;
    }

    .card.playing {
      background-color: #111111;
      color: #f2f0eb;
    }

    .card.selected {
      outline: 4px solid #e8452c;
      outline-offset: -4px;
    }

    .card:disabled {
      opacity: 0.35;
    }

    #actions {
      display: flex;
      gap: 12px;
    }

    #actions button {
      flex: 1;
      padding: 18px 0;
      font-size: 16px;
    }

    #confirmBtn {
      background-color: #111111;
      color: #f2f0eb;
    }

    #confirmBtn:disabled {
      opacity: 0.25;
    }

    /* 시작 오버레이: 첫 터치로 오디오 언락 */
    #startOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background-color: #f2f0eb;
      font-size: 20px;
      text-align: center;
      padding: 16px;
      z-index: 10;
    }

    #startOverlay .hint {
      font-size: 13px;
      opacity: 0.6;
      line-height: 1.6;
    }

    /* 결과 */
    #result {
      display: none;
      font-size: 14px;
      line-height: 1.7;
      padding: 16px;
      border: 1px solid #111111;
    }

    /* 보정(캘리브레이션) 패널 */
    #calibPanel {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 70%;
      overflow-y: auto;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
      background-color: #ffffff;
      border-top: 1px solid #111111;
      font-size: 13px;
      z-index: 5;
    }

    #calibPanel.open {
      display: block;
    }

    .calib-row {
      display: grid;
      grid-template-columns: 56px 1fr 72px 64px;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #e0ddd6;
    }

    .calib-row input[type="range"] {
      width: 100%;
    }

    .calib-row button {
      padding: 8px 0;
    }

    #calibPanel .tally {
      padding-top: 12px;
      opacity: 0.7;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
  <script src="./register.js"></script>
</head>
<body>
  <div id="startOverlay">
    <div>헤드폰을 쓰고 화면을 터치하세요</div>
    <div class="hint">음역 고르기 단독 테스트 (Part 1 · ②)<br>소리가 안 나면 무음 모드와 블루투스 연결을 확인하세요</div>
  </div>

  <div id="app">
    <header>
      <span class="mono">PART 1 · ② REGISTER</span>
      <button id="calibToggle" class="mono" style="padding:6px 10px;font-size:12px;">보정</button>
    </header>

    <div id="prompt">같은 멜로디를 세 번 들려드릴게요.</div>

    <div id="cards"></div>

    <div id="result"></div>

    <div id="actions">
      <button id="replayAllBtn">다시 전부 듣기</button>
      <button id="confirmBtn" disabled>이걸로 할게요</button>
    </div>
  </div>

  <div id="calibPanel">
    <div class="mono" style="padding-bottom:8px;">LOUDNESS OFFSET (dB) · 세 음역이 같은 크기로 들리게 맞추세요</div>
    <div id="calibRows"></div>
    <div class="calib-row">
      <span class="mono">MASTER</span>
      <input id="masterSlider" type="range" min="0" max="1" step="0.01">
      <span id="masterLabel" class="mono"></span>
      <button id="resetCalibBtn">초기화</button>
    </div>
    <div id="tally" class="tally mono"></div>
  </div>
</body>
</html>
