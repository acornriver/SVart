<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>모든 귀는 […] 이다 · 청각 다변기 (Sound Variator)</title>
  
  <!-- 모바일 뷰포트 & iOS/Android 줌 및 바운스 차단 메타 태그 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">

  <style>
    /* 웹 폰트: 인터넷 없이도 뜨도록 레포에 둠 (Latin + 한글 2,350자. 그 밖의 글자는 기기 기본 글꼴) */
    @font-face { font-family: 'Noto Sans KR'; font-weight: 400; font-display: swap; src: url('./lib/fonts/NotoSansKR-400.woff2') format('woff2'); }
    @font-face { font-family: 'Noto Sans KR'; font-weight: 500; font-display: swap; src: url('./lib/fonts/NotoSansKR-500.woff2') format('woff2'); }
    @font-face { font-family: 'Noto Sans KR'; font-weight: 700; font-display: swap; src: url('./lib/fonts/NotoSansKR-700.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: swap; src: url('./lib/fonts/IBMPlexMono-400.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: url('./lib/fonts/IBMPlexMono-500.woff2') format('woff2'); }
    /* 브라우저 기본 스크롤, 바운스, 줌, 텍스트 선택 완벽 차단 */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #000;
      color: #f5f5f0;
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
    }

    /* p5.js 캔버스 스타일 */
    #defaultCanvas0 {
      position: relative;
      z-index: 1;
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
      outline: none;
    }

    /* 결과 화면 배경 영상: 캔버스 뒤에 고대비 흑백 */
    video.backdrop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: grayscale(1) contrast(2.4) brightness(0.55);
      pointer-events: none;
      z-index: 0;
    }

    /* 첫 화면: 모든 귀는 [ ] 이다 + 언어 고르기 (캔버스 위 DOM, 입력칸과 언어 버튼만 터치를 받음) */
    input { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
    .intro { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 26px; padding: 0 24px; pointer-events: none; text-align: center; color: #f5f5f0; transition: opacity 1s ease; }
    .intro.out { opacity: 0; }
    .intro.gone { display: none; }
    .intro .langs { position: absolute; top: max(24px, env(safe-area-inset-top)); right: 24px; display: flex; gap: 6px; }
    .intro .langs button { pointer-events: auto; touch-action: manipulation; font: 500 18px 'Noto Sans KR', sans-serif; color: #80807c;
      background: transparent; border: 1.5px solid #3a3a38; border-radius: 999px; padding: 8px 16px; transition: all .3s ease; }
    .intro .langs button.on { color: #000; background: #f5f5f0; border-color: #f5f5f0; }
    .intro .langs .spk { display: flex; align-items: center; padding: 5px 12px; color: #f5f5f0; }
    .intro .langs .spk svg { width: 24px; height: 24px; display: block; pointer-events: none; }
    .intro .langs .spk .off { display: none; }
    .intro .langs .spk.muted { color: #ff3b1f; border-color: #ff3b1f; }
    .intro .langs .spk.muted .on { display: none; }
    .intro .langs .spk.muted .off { display: inline; }
    .intro.started .langs { opacity: 0; transition: opacity .4s ease; }
    .intro .title-btn { pointer-events: auto; touch-action: manipulation; background: transparent; border: none; outline: none;
      margin: 0; padding: 0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: clamp(32px, 8.6vw, 96px); line-height: 1.2; letter-spacing: -.055em; max-width: 100%; color: #f5f5f0; white-space: nowrap;
      -webkit-tap-highlight-color: transparent; }
    .intro .title-btn:active { opacity: .7; }
    .intro .before, .intro .after { display: inline; }
    .intro .br { color: #ff3b1f; }
    .intro .dots { color: #f5f5f0; letter-spacing: .15em; }
    .intro .hint { white-space: pre-line; line-height: 1.7; font-size: clamp(18px, 2.6vw, 24px); letter-spacing: .04em; color: #bdbdb7; transition: opacity .4s ease; display: block; }
  </style>
  <link rel="stylesheet" href="./memeFX.css">

  <!-- p5.js 1.9.4 및 p5.sound (CDN에 의존하지 않게 lib/에 둠) -->
  <script src="./lib/p5.min.js"></script>
  <script src="./lib/p5.sound.min.js"></script>

  <!-- Part 1 전용 모듈 스크립트 (GitHub Pages 상대 경로 './' 사용) -->
  <!-- 1. 단일 전역 상태 정의 -->
  <script src="./globalState.js"></script>

  <!-- 2. 화면 문구 (한국어 / English) -->
  <script src="./copy.js"></script>
  <script src="./voiceMemesound.js"></script>

  <!-- 3. 청감 코드 (IwS/6 · CRH 16.5) -->
  <script src="./earCode.js"></script>

  <!-- 음성 안내 -->
  <script src="./voice.js"></script>
  <script src="./memeFX.js"></script>

  <!-- 4. 검사용 비트 · 결과 화면의 북서울 산책과 보내기 -->
  <script src="./loudness.js"></script>
  <script src="./beat.js"></script>
  <script src="./tour.js"></script>

  <!-- 5. Part 1 오디오 파이프라인과 전체 진행 -->
  <script src="./part1_audio.js"></script>

  <!-- 6. Part 2 임시 검사 -->
  <script src="./part2_audio.js"></script>

  <!-- 7. 달팽이 비주얼 렌더러 및 인터페이스 UI -->
  <script src="./visuals.js"></script>

  <!-- 8. p5.js 생명주기 및 이벤트 메인 라우터 -->
  <script src="./main.js"></script>

  <script src="./cloud/schema.js"></script>
  <script src="./cloud/config.js"></script>
  <script src="./cloud/firebase.js"></script>
  <script src="./cloud/send.js"></script>

</head>
<body>
</body>
</html>
